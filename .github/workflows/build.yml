name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev autoconf automake libtool pkg-config
          pip install buildozer Cython==0.29.36
      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true
      - name: Prepare files
        run: |
          unzip -o sentinel.zip -d.
          if [ -d sentinel ]; then cp -r sentinel/*.; fi
          cp sentinel.py main.py
          ls -la
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel-APK
          path: bin/*.apk
