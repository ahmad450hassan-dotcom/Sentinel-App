name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tools
        run: |
          pip install buildozer Cython==0.29.36
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip
          unzip -o sentinel.zip -d.
          cp sentinel.py main.py
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel-APK
          path: bin/*.apk
